model:
  default: gpt-4.1
  provider: copilot
  base_url: https://api.githubcopilot.com
  api_mode: chat_completions
terminal:
  backend: local
  cwd: .
  timeout: 180
  persistent_shell: true
agent:
  max_turns: 60
  reasoning_effort: medium
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
skills:
  creation_nudge_interval: 15
  # 額外掃描的 skills 目錄（相對於 .hermes/ 或絕對路徑）
  # repo 內的自訂 skills 放在 ../hermes/skills/，跟著 git 版控
  external_dirs:
    - ../hermes/skills
plugins:
  # 啟用的自訂 plugins（放在 ../hermes/plugins/）
  # 注意：project-local plugins 需啟動前設 HERMES_ENABLE_PROJECT_PLUGINS=true
  enabled: []
  disabled: []
display:
  compact: false
  tool_progress: all
  streaming: true
onboarding:
  seen:
    tool_progress_prompt: true
