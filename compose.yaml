name: stock-intelligent-assistant
services:
  api:
    build: .
    image: stock-intelligent-assistant:local
    environment:
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      FINMIND_TOKEN: ${FINMIND_TOKEN:-}
      ETF_WATCHLIST: ${ETF_WATCHLIST:-}
      FINMIND_REQUEST_INTERVAL: ${FINMIND_REQUEST_INTERVAL:-1}
      FINMIND_HOURLY_BUDGET: ${FINMIND_HOURLY_BUDGET:-300}
      GOOGLE_NEWS_ENABLED: ${GOOGLE_NEWS_ENABLED:-false}
      TZ: Asia/Taipei
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - 127.0.0.1:8000:8000
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
