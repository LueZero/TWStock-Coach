# Independent frontend host. Replace server_name, root and API upstream as needed.
# Reference: https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass
server {
    listen 80;
    server_name _;
    root /srv/twstock-coach/web/dist;
    index index.html;

    # Independent local agent; ^~ prevents the generic API regex from matching.
    location ^~ /api/assistant/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 420s;
    }

    # Preserve the original API path and query. Both browser and API share an origin.
    location ~ ^/(api/|docs(?:/|$)|health$|openapi\.json$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
